[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#080c14"
secondaryBackgroundColor = "#0d1421"
textColor = "#e8edf5"
font = "sans serif"

[server]
maxUploadSize = 50
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[runner]
fastReruns = true

[ui]
hideSidebarNav = false
